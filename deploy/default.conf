# TLS terminates at the operator's edge. Only compose's loopback port is exposed.
limit_req_zone $binary_remote_addr zone=duo_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=duo_auth:1m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=duo_conn:1m;
server {
    listen 8080;
    server_name duo.steamprofiler.org;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 15s;
    limit_conn duo_conn 30;
    limit_req_status 429;
    # Neither Steam assertions nor session-bearing query strings belong in logs.
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self' https://steamcommunity.com" always;

    location /api/auth/ {
        limit_req zone=duo_auth burst=10 nodelay;
        # nginx error logs can include the callback query on an upstream failure.
        error_log /dev/null;
        proxy_pass http://api:16300;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_hide_header Server;
    }
    location = /api/v1/assets {
        client_max_body_size 1250000;
        limit_req zone=duo_api burst=5 nodelay;
        proxy_pass http://api:16300;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_hide_header Server;
    }
    location /api/ {
        limit_req zone=duo_api burst=20 nodelay;
        proxy_pass http://api:16300;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_hide_header Server;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
